<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞名阁 - 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#C41E3A', light: '#E8837C', dark: '#8B1A1A' },
                        gold: { DEFAULT: '#B8860B', light: '#F0D060' },
                        cream: '#FAF8F5',
                        warm: { 50:'#f8f6f3', 100:'#efe9e0', 200:'#ddd2c3', 300:'#c7b59e', 400:'#b09478', 500:'#a07d64', 600:'#91705a', 700:'#775c4c', 800:'#634d42', 900:'#534138' }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background: #f5f0eb; color: #534138; }
        .font-serif-cn { font-family: 'Noto Serif SC', serif; }
        .card-shadow { box-shadow: 0 2px 16px rgba(139,26,26,0.08); }
        .sidebar-bg { background: linear-gradient(180deg, #8B1A1A 0%, #C41E3A 50%, #D4456A 100%); }
        .btn-primary {
            background: linear-gradient(135deg, #C41E3A, #E8837C);
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(196,30,58,0.25);
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(196,30,58,0.35); transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.97); }
        .input-field {
            background: #faf8f5;
            border: 1.5px solid #efe9e0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s;
            outline: none;
            color: #534138;
        }
        .input-field:focus { border-color: #C41E3A; background: #fff; box-shadow: 0 0 0 3px rgba(196,30,58,0.08); }
        .input-field::placeholder { color: #c7b59e; }
        .stat-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(139,26,26,0.06); border: 1px solid rgba(139,26,26,0.06); transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(139,26,26,0.1); }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-style { width: 100%; border-collapse: collapse; min-width: 700px; }
        .table-style th { background: #f8f6f3; color: #91705a; font-weight: 600; padding: 12px 16px; text-align: left; font-size: 13px; border-bottom: 2px solid #efe9e0; white-space: nowrap; }
        .table-style td { padding: 14px 16px; border-bottom: 1px solid #f0ebe5; font-size: 14px; white-space: nowrap; }
        .table-style tr:hover td { background: #faf8f5; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
        .tag-red { background: #fde8eb; color: #C41E3A; }
        .tag-green { background: #e8f5e9; color: #2e7d32; }
        .tag-gold { background: #fff8e1; color: #B8860B; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
        .modal-box.modal-sm { max-width: 480px; }
        .toast { position: fixed; top: 24px; right: 24px; padding: 12px 24px; border-radius: 10px; color: white; font-size: 14px; z-index: 2000; display: none; }
        .toast.show { display: block; animation: slideIn 0.3s ease; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #C41E3A; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .action-btn { padding: 6px 14px; border-radius: 8px; font-size: 13px; border: none; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .action-btn.red { background: #fde8eb; color: #C41E3A; }
        .action-btn.red:hover { background: #f5cdd4; }
        .action-btn.green { background: #e8f5e9; color: #2e7d32; }
        .action-btn.green:hover { background: #c8e6c9; }
        .login-gradient { background: linear-gradient(135deg, #8B1A1A 0%, #C41E3A 50%, #D4456A 100%); }
        .sidebar-item { padding: 14px 20px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; border-left: 3px solid transparent; color: rgba(255,255,255,0.75); }
        .sidebar-item:hover, .sidebar-item.active { background: rgba(255,255,255,0.12); color: white; border-left-color: #F0D060; }
        .sidebar-item.active { background: rgba(255,255,255,0.15); font-weight: 600; }
        .rich-editor { min-height: 200px; background: #faf8f5; border: 1.5px solid #efe9e0; border-radius: 10px; padding: 12px; outline: none; }
        .rich-editor:focus { border-color: #C41E3A; box-shadow: 0 0 0 3px rgba(196,30,58,0.08); }

        /* 移动端侧边栏 */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .sidebar-overlay.show { opacity: 1; visibility: visible; }

        @media (max-width: 767px) {
            .desktop-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .admin-content { margin-left: 0 !important; padding-top: 64px; }
            .mobile-header { display: flex !important; }
            .page-content-padding { padding: 16px !important; }
            .stat-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
            .login-box { width: 100% !important; max-width: 100% !important; padding: 24px !important; }
            .modal-box { padding: 20px !important; border-radius: 16px !important; }
        }
        @media (min-width: 768px) {
            .mobile-header { display: none !important; }
            .sidebar-overlay { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-gradient min-h-screen flex items-center justify-center p-4" id="loginPage">
        <div class="bg-white rounded-2xl p-8 sm:p-10 login-box card-shadow" style="width:420px;max-width:100%;">
            <div class="text-center mb-8">
                <div class="text-4xl mb-3">🏮</div>
                <h1 class="font-serif-cn text-3xl font-bold text-primary">瑞名阁</h1>
                <p class="text-warm-400 mt-2 text-sm">管理后台</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-warm-600 mb-2">用户名</label>
                    <input type="text" class="input-field" id="username" placeholder="请输入用户名">
                </div>
                <div>
                    <label class="block text-sm text-warm-600 mb-2">密码</label>
                    <input type="password" class="input-field" id="password" placeholder="请输入密码">
                </div>
                <button class="btn-primary w-full py-3 rounded-xl text-white font-semibold mt-2" onclick="login()">
                    登 录
                </button>
            </div>
        </div>
    </div>

    <!-- 管理后台 -->
    <div class="hidden" id="adminPage">
        <!-- 移动端顶部栏 -->
        <div class="mobile-header fixed top-0 left-0 right-0 bg-white z-30 px-4 py-3 border-b" style="border-color:#f0ebe5;box-shadow:0 2px 8px rgba(139,26,26,0.06);">
            <div class="flex items-center justify-between">
                <button id="hamburgerBtn" class="text-warm-600 text-xl p-2 -ml-2" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="font-serif-cn text-lg font-bold text-primary">瑞名阁</div>
                <div class="w-10"></div>
            </div>
        </div>

        <!-- 移动端侧边栏遮罩 -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <!-- 侧边栏 -->
        <div class="desktop-sidebar fixed left-0 top-0 w-56 h-full sidebar-bg flex flex-col z-50">
            <div class="text-center py-8 border-b border-white/10">
                <div class="text-3xl mb-2">🏮</div>
                <div class="font-serif-cn text-white text-xl font-bold">瑞名阁</div>
                <div class="text-white/50 text-xs mt-1">管理后台</div>
            </div>
            <div class="flex-1 py-4 overflow-y-auto">
                <div class="sidebar-item active" onclick="showPage('dashboard', this)">
                    <i class="fas fa-chart-line w-5 text-center"></i>
                    <span>数据概览</span>
                </div>
                <div class="sidebar-item" onclick="showPage('users', this)">
                    <i class="fas fa-users w-5 text-center"></i>
                    <span>用户管理</span>
                </div>
                <div class="sidebar-item" onclick="showPage('codes', this)">
                    <i class="fas fa-ticket-alt w-5 text-center"></i>
                    <span>兑换码管理</span>
                </div>
                <div class="sidebar-item" onclick="showPage('records', this)">
                    <i class="fas fa-history w-5 text-center"></i>
                    <span>起名记录</span>
                </div>
                <div class="sidebar-item" onclick="showPage('articles', this)">
                    <i class="fas fa-newspaper w-5 text-center"></i>
                    <span>起名知识</span>
                </div>
                <div class="sidebar-item" onclick="showPage('configs', this)">
                    <i class="fas fa-cog w-5 text-center"></i>
                    <span>系统配置</span>
                </div>
            </div>
            <div class="p-4 border-t border-white/10">
                <div class="flex items-center justify-between">
                    <div class="text-white/70 text-sm">
                        <i class="fas fa-user-circle mr-1"></i>
                        <span id="adminUsername">管理员</span>
                    </div>
                    <button class="text-white/50 hover:text-white text-sm transition-colors" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="admin-content ml-56 min-h-screen">
            <!-- 顶部 -->
            <div class="bg-white px-4 sm:px-8 py-4 sm:py-5 flex items-center justify-between card-shadow" style="border-bottom: 1px solid #f0ebe5;">
                <div class="font-serif-cn text-lg sm:text-xl font-bold text-warm-900" id="pageTitle">数据概览</div>
                <div class="text-warm-400 text-xs sm:text-sm">
                    <span id="currentTime"></span>
                </div>
            </div>

            <!-- 页面内容 -->
            <div class="p-4 sm:p-8 page-content-padding" id="pageContent"></div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <div class="flex items-center justify-between mb-5">
                <h3 class="font-serif-cn text-lg font-bold text-warm-900" id="modalTitle">标题</h3>
                <button class="text-warm-400 hover:text-warm-600 text-xl leading-none" onclick="closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('admin_token');

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        if (token) { showAdminPage(); }

        // 移动端侧边栏控制
        function toggleSidebar() {
            document.getElementById('sidebarOverlay').classList.add('show');
            document.querySelector('.desktop-sidebar').style.transform = 'translateX(0)';
        }
        function closeSidebar() {
            document.getElementById('sidebarOverlay').classList.remove('show');
            document.querySelector('.desktop-sidebar').style.transform = 'translateX(-100%)';
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) { showToast('请输入用户名和密码', true); return; }
            try {
                const res = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    localStorage.setItem('admin_username', data.username);
                    showAdminPage();
                } else {
                    showToast(data.error || '登录失败', true);
                }
            } catch (e) { showToast('网络错误', true); }
        }

        function logout() {
            token = null;
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_username');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('adminPage').classList.add('hidden');
        }

        function showAdminPage() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            document.getElementById('adminUsername').textContent = localStorage.getItem('admin_username') || '管理员';
            showPage('dashboard');
        }

        let currentPage = 'dashboard';

        async function showPage(page, el) {
            // 移动端关闭侧边栏
            if (window.innerWidth < 768) closeSidebar();

            currentPage = page;
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            if (el) el.classList.add('active');
            else {
                const items = document.querySelectorAll('.sidebar-item');
                items.forEach(item => {
                    const txt = item.querySelector('span').textContent;
                    const map = { '数据概览':'dashboard','用户管理':'users','兑换码管理':'codes','起名记录':'records','起名知识':'articles','系统配置':'configs' };
                    if (map[txt] === page) item.classList.add('active');
                });
            }

            const titles = { dashboard:'数据概览', users:'用户管理', codes:'兑换码管理', records:'起名记录', articles:'起名知识', configs:'系统配置' };
            document.getElementById('pageTitle').textContent = titles[page];

            if (page === 'dashboard') await loadDashboard();
            else if (page === 'users') await loadUsers();
            else if (page === 'codes') await loadCodes();
            else if (page === 'records') await loadRecords();
            else if (page === 'articles') await loadArticles();
            else if (page === 'configs') await loadConfigs();
        }

        async function api(endpoint, options = {}) {
            const res = await fetch(API_BASE + endpoint, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...options.headers, 'Authorization': 'Bearer ' + token }
            });
            return res.json();
        }

        // ========== 数据概览 ==========
        async function loadDashboard() {
            const data = await api('/admin/stats');
            document.getElementById('pageContent').innerHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-5 mb-6 lg:mb-8 stat-grid">
                    <div class="stat-card border-l-4 border-primary">
                        <div class="text-warm-400 text-xs lg:text-sm mb-1">总用户数</div>
                        <div class="text-2xl lg:text-3xl font-bold text-warm-900 font-serif-cn">${data.users?.total || 0}</div>
                    </div>
                    <div class="stat-card border-l-4 border-gold">
                        <div class="text-warm-400 text-xs lg:text-sm mb-1">今日起名</div>
                        <div class="text-2xl lg:text-3xl font-bold text-warm-900 font-serif-cn">${data.today?.records || 0}</div>
                    </div>
                    <div class="stat-card border-l-4 border-primary">
                        <div class="text-warm-400 text-xs lg:text-sm mb-1">累计起名</div>
                        <div class="text-2xl lg:text-3xl font-bold text-warm-900 font-serif-cn">${data.records?.total || 0}</div>
                    </div>
                    <div class="stat-card border-l-4 border-gold">
                        <div class="text-warm-400 text-xs lg:text-sm mb-1">兑换码总量</div>
                        <div class="text-2xl lg:text-3xl font-bold text-warm-900 font-serif-cn">${data.codes?.total || 0}</div>
                    </div>
                </div>
                <div class="bg-white rounded-2xl card-shadow p-4 sm:p-6">
                    <h3 class="font-serif-cn font-bold text-warm-900 mb-4">📊 近7天趋势</h3>
                    <div class="table-wrapper">
                        <table class="table-style">
                            <thead><tr><th>日期</th><th>起名次数</th><th>新增用户</th></tr></thead>
                            <tbody>
                                ${(data.trend||[]).length ? data.trend.map(t => `<tr><td>${t.date}</td><td>${t.count}</td><td>${t.users||0}</td></tr>`).join('') : '<tr><td colspan="3" class="text-center text-warm-300 py-8">暂无数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ========== 用户管理 ==========
        async function loadUsers() {
            const data = await api('/admin/users');
            document.getElementById('pageContent').innerHTML = `
                <div class="bg-white rounded-2xl card-shadow overflow-hidden">
                    <div class="p-4 lg:p-5 flex gap-3 border-b flex-wrap" style="border-color:#f0ebe5;">
                        <input type="text" class="input-field flex-1" id="userKeyword" placeholder="搜索昵称 / openid" style="max-width:260px;min-width:150px;">
                        <button class="btn-primary px-4 lg:px-5 py-2 rounded-lg text-white text-sm" onclick="loadUsers()">
                            <i class="fas fa-search mr-1"></i>搜索
                        </button>
                    </div>
                    <div class="table-wrapper">
                        <table class="table-style">
                            <thead>
                                <tr>
                                    <th>ID</th><th>昵称</th><th>余额</th>
                                    <th>累计使用</th><th>状态</th><th>注册时间</th><th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(data.list||[]).length ? data.list.map(u => `
                                <tr>
                                    <td>${u.id}</td>
                                    <td class="font-medium max-w-[100px] truncate">${u.nickname||'-'}</td>
                                    <td><span class="tag tag-gold">${u.credits}次</span></td>
                                    <td>${u.total_used||0}</td>
                                    <td><span class="tag ${u.status===1?'tag-green':'tag-red'}">${u.status===1?'正常':'禁用'}</span></td>
                                    <td class="text-warm-400 text-xs">${(u.created_at||'').slice(0,10)}</td>
                                    <td>
                                        <button class="action-btn ${u.status===1?'red':'green'}" onclick="toggleUser(${u.id},${u.status})">${u.status===1?'禁用':'启用'}</button>
                                        <button class="action-btn red" onclick="editUserCredits(${u.id},${u.credits})">改余额</button>
                                    </td>
                                </tr>`).join('') : '<tr><td colspan="7" class="text-center text-warm-300 py-12">暂无用户数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        async function toggleUser(id, status) {
            await api(`/admin/users/${id}?toggle`, {method:'POST'});
            loadUsers();
        }

        function editUserCredits(id, current) {
            showModal('修改用户余额', `
                <div>
                    <label class="block text-sm text-warm-600 mb-2">新余额（次）</label>
                    <input type="number" class="input-field" id="newCredits" value="${current}">
                </div>
            `, async () => {
                const credits = parseInt(document.getElementById('newCredits').value);
                await api(`/admin/users/${id}?credits`, {method:'POST', body:JSON.stringify({credits})});
                closeModal(); loadUsers();
            });
        }

        // ========== 兑换码管理 ==========
        async function loadCodes() {
            const data = await api('/admin/codes');
            document.getElementById('pageContent').innerHTML = `
                <div class="bg-white rounded-2xl card-shadow overflow-hidden">
                    <div class="p-4 lg:p-5 flex gap-3 border-b" style="border-color:#f0ebe5;">
                        <button class="btn-primary px-4 lg:px-5 py-2 rounded-lg text-white text-sm" onclick="showCreateCodeModal()">
                            <i class="fas fa-plus mr-1"></i>生成兑换码
                        </button>
                    </div>
                    <div class="table-wrapper">
                        <table class="table-style">
                            <thead>
                                <tr>
                                    <th>ID</th><th>兑换码</th><th>次数</th><th>已使用</th>
                                    <th>状态</th><th>过期时间</th><th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(data.list||[]).length ? data.list.map(c => `
                                <tr>
                                    <td>${c.id}</td>
                                    <td><code class="bg-warm-50 px-2 py-1 rounded text-xs lg:text-sm font-mono break-all">${c.code}</code></td>
                                    <td>${c.amount}次</td>
                                    <td>${c.used_count}${c.max_use>0?'/'+c.max_use:'/'+'∞'}</td>
                                    <td><span class="tag ${c.status===1?'tag-green':'tag-red'}">${c.status===1?'正常':'禁用'}</span></td>
                                    <td class="text-warm-400 text-xs">${c.expired_at?(c.expired_at.slice(0,10)):'永不过期'}</td>
                                    <td>
                                        <button class="action-btn ${c.status===1?'red':'green'}" onclick="toggleCode(${c.id},${c.status})">${c.status===1?'禁用':'启用'}</button>
                                    </td>
                                </tr>`).join('') : '<tr><td colspan="7" class="text-center text-warm-300 py-12">暂无兑换码数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function showCreateCodeModal() {
            showModal('生成兑换码', `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">兑换次数</label>
                            <input type="number" class="input-field" id="codeAmount" value="10">
                        </div>
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">最大使用次数</label>
                            <input type="number" class="input-field" id="codeMaxUse" value="1">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">生成数量</label>
                            <input type="number" class="input-field" id="codeCount" value="1">
                        </div>
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">过期时间</label>
                            <input type="date" class="input-field" id="codeExpire">
                        </div>
                    </div>
                    <p class="text-xs text-warm-300 mt-2">* 空日期表示永不过期</p>
                </div>
            `, async () => {
                const amount = parseInt(document.getElementById('codeAmount').value);
                const maxUse = parseInt(document.getElementById('codeMaxUse').value);
                const count = parseInt(document.getElementById('codeCount').value);
                const expiredAt = document.getElementById('codeExpire').value || null;
                const data = await api('/admin/codes', {method:'POST', body:JSON.stringify({amount, maxUse, count, expiredAt})});
                if (data.success) {
                    closeModal();
                    showToast('成功生成 ' + (data.codes||[]).length + ' 个兑换码');
                    loadCodes();
                }
            }, true);
        }

        async function toggleCode(id, status) {
            await api(`/admin/codes/${id}?toggle`, {method:'POST'});
            loadCodes();
        }

        // ========== 起名记录 ==========
        let recordsPage = 1;
        async function loadRecords() {
            const gender = document.getElementById('recordGender')?.value || '';
            const dateFrom = document.getElementById('recordStart')?.value || '';
            const dateTo = document.getElementById('recordEnd')?.value || '';
            const params = new URLSearchParams({ page: recordsPage, pageSize: 20 });
            if (gender) params.set('gender', gender);
            if (dateFrom) params.set('dateFrom', dateFrom);
            if (dateTo) params.set('dateTo', dateTo);
            const data = await api('/admin/records?' + params.toString());

            document.getElementById('pageContent').innerHTML = `
                <div class="bg-white rounded-2xl card-shadow overflow-hidden">
                    <div class="p-4 lg:p-5 flex gap-3 flex-wrap border-b" style="border-color:#f0ebe5;">
                        <select class="input-field" id="recordGender" style="width:110px;flex-shrink:0;" onchange="recordsPage=1;loadRecords()">
                            <option value="">全部性别</option>
                            <option value="boy" ${gender==='boy'?'selected':''}>男宝宝</option>
                            <option value="girl" ${gender==='girl'?'selected':''}>女宝宝</option>
                        </select>
                        <input type="date" class="input-field" id="recordStart" style="width:140px;flex-shrink:0;" value="${dateFrom}" onchange="recordsPage=1;loadRecords()">
                        <input type="date" class="input-field" id="recordEnd" style="width:140px;flex-shrink:0;" value="${dateTo}" onchange="recordsPage=1;loadRecords()">
                        <span class="ml-auto text-warm-400 text-sm self-center whitespace-nowrap">共 ${data.total || 0} 条</span>
                    </div>
                    <div class="table-wrapper">
                        <table class="table-style">
                            <thead>
                                <tr>
                                    <th>ID</th><th>姓氏</th><th>性别</th>
                                    <th>出生日期</th><th>生成名字</th><th>来源</th><th>时间</th><th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(data.list||[]).length ? data.list.map(r => {
                                    const names = r.names_parsed || [];
                                    const firstName = names.length > 0 ? (names[0].name || r.name || '') : (r.name || '');
                                    return `<tr>
                                    <td>${r.id}</td>
                                    <td class="font-serif-cn font-bold">${r.surname}</td>
                                    <td>${r.gender==='boy'?'👦男':'👧女'}</td>
                                    <td class="text-warm-400 text-xs">${r.birthday || '-'}</td>
                                    <td class="font-serif-cn text-primary text-sm">${firstName}</td>
                                    <td><span class="tag ${r.source==='ai'?'tag-gold':'tag-green'}">${r.source==='ai'?'AI':'本地'}</span></td>
                                    <td class="text-warm-400 text-xs">${(r.created_at||'').slice(0,16)}</td>
                                    <td><button class="action-btn green text-xs px-2 py-1" onclick="showRecordDetail(${r.id})">查看</button></td>
                                </tr>`}).join('') : '<tr><td colspan="8" class="text-center text-warm-300 py-12">暂无起名记录</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    ${data.totalPages > 1 ? `<div class="p-4 flex items-center justify-center gap-4 border-t flex-wrap" style="border-color:#f0ebe5;">
                        <button class="action-btn red" ${recordsPage<=1?'disabled style="opacity:0.4"':''} onclick="recordsPage--;loadRecords()">上一页</button>
                        <span class="text-warm-500 text-sm">第 ${recordsPage} / ${data.totalPages} 页</span>
                        <button class="action-btn red" ${recordsPage>=data.totalPages?'disabled style="opacity:0.4"':''} onclick="recordsPage++;loadRecords()">下一页</button>
                    </div>` : ''}
                </div>
            `;
        }

        // ========== 起名知识（文章管理） ==========
        let articlesPage = 1;
        let articlesPageSize = 10;
        let articleEditId = null;

        // ========== 起名记录详情 ==========
        let currentRecordDetail = null;
        async function showRecordDetail(id) {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'index.html'; return; }
            const res = await fetch(API_BASE + '/admin/records?pageSize=100', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            const rec = data.list.find(r => r.id === id);
            if (!rec) { showToast('记录不存在', true); return; }
            currentRecordDetail = rec;

            const bazi = rec.bazi || {};
            const baziYear = bazi.year || '-';
            const baziMonth = bazi.month || '-';
            const baziDay = bazi.day || '-';
            const baziHour = bazi.hour || '-';
            const wuxing = bazi.wuxing || {};
            const xiyongshen = bazi.xiyongshen || [];
            const dayMaster = bazi.day_master || '-';
            const strength = bazi.day_master_strength || '-';
            const names = rec.names_parsed || [];
            const nameJson = rec.name_json || '{}';
            let namesDetail = [];
            try {
                const parsed = JSON.parse(nameJson);
                if (parsed.names && Array.isArray(parsed.names)) namesDetail = parsed.names;
            } catch(e) {}

            const wxMap = { '木':'木', '火':'火', '土':'土', '金':'金', '水':'水' };
            const wxBars = Object.entries(wuxing).map(([k,v]) => {
                const colors = { '木':'#6BA刃', '火':'#E74C3C', '土':'#E67E22', '金':'#95A5A6', '水':'#3498DB' };
                const pct = Math.min(100, Math.round(v / 20 * 100));
                const color = colors[k] || '#999';
                return `<div class="flex items-center gap-2 mb-1">
                    <span class="text-xs w-4 text-warm-500">${k}</span>
                    <div class="flex-1 bg-warm-100 rounded-full h-3">
                        <div class="rounded-full h-3 text-xs text-white flex items-center justify-end pr-1" style="width:${pct}%;background:${color}">${v}</div>
                    </div>
                    <span class="text-xs w-6 text-right text-warm-700">${v}</span>
                </div>`;
            }).join('');

            const namesHtml = namesDetail.length > 0 ? namesDetail.map(n => {
                const nameStr = typeof n === 'string' ? n : (n.name || '');
                const wux = n.wuxing || (typeof n === 'object' && n.wuxing) || '';
                const pinyin = n.pinyin || '';
                const score = n.score || '';
                return `<div class="flex items-center justify-between p-3 bg-warm-50 rounded-xl">
                    <span class="font-serif-cn text-lg font-bold text-primary">${nameStr}</span>
                    <div class="flex gap-3 text-xs text-warm-400">
                        ${pinyin ? `<span>${pinyin}</span>` : ''}
                        ${wux ? `<span class="px-2 py-0.5 rounded-full bg-primary/10 text-primary">${wux}</span>` : ''}
                        ${score ? `<span>评分 ${score}</span>` : ''}
                    </div>
                </div>`;
            }).join('') : `<div class="text-warm-300 text-center py-4">暂无详细名字数据</div>`;

            const body = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-warm-50 p-3 rounded-xl">
                            <div class="text-xs text-warm-400 mb-1">基本信息</div>
                            <div class="text-sm"><span class="text-warm-500">姓氏：</span><span class="font-serif-cn font-bold">${rec.surname}</span></div>
                            <div class="text-sm"><span class="text-warm-500">性别：</span>${rec.gender === 'boy' ? '男' : '女'}</div>
                            <div class="text-sm"><span class="text-warm-500">生日：</span>${rec.birthday || '-'}</div>
                            <div class="text-sm"><span class="text-warm-500">来源：</span>${rec.source === 'ai' ? 'AI' : '本地'}</div>
                            <div class="text-sm"><span class="text-warm-500">时间：</span>${rec.created_at || '-'}</div>
                        </div>
                        <div class="bg-red-50 p-3 rounded-xl">
                            <div class="text-xs text-warm-400 mb-1">日主信息</div>
                            <div class="text-lg font-bold font-serif-cn text-red-700">${dayMaster}</div>
                            <div class="text-sm text-warm-600">${strength}</div>
                            <div class="text-sm mt-1"><span class="text-warm-500">喜用神：</span>${xiyongshen.join('、') || '-'}</div>
                        </div>
                    </div>
                    <div class="bg-gradient-to-r from-red-50 to-amber-50 p-4 rounded-xl">
                        <div class="text-xs text-warm-400 mb-2 text-center">四柱八字</div>
                        <div class="grid grid-cols-4 gap-2 text-center">
                            <div><div class="text-xs text-warm-400">年柱</div><div class="font-serif-cn font-bold text-warm-800">${baziYear}</div></div>
                            <div><div class="text-xs text-warm-400">月柱</div><div class="font-serif-cn font-bold text-warm-800">${baziMonth}</div></div>
                            <div><div class="text-xs text-warm-400">日柱</div><div class="font-serif-cn font-bold text-red-700">${baziDay}</div></div>
                            <div><div class="text-xs text-warm-400">时柱</div><div class="font-serif-cn font-bold text-warm-800">${baziHour}</div></div>
                        </div>
                    </div>
                    <div class="bg-warm-50 p-3 rounded-xl">
                        <div class="text-xs text-warm-400 mb-2">五行分布</div>
                        ${wxBars}
                    </div>
                    <div>
                        <div class="text-xs text-warm-400 mb-2">推荐名字（共${names.length}个）</div>
                        <div class="space-y-2">${names.map(n => {
                            const nameStr = typeof n === 'string' ? n : (n.name || '');
                            return `<div class="flex items-center justify-between p-3 bg-warm-50 rounded-xl">
                                <span class="font-serif-cn text-lg font-bold text-primary">${nameStr}</span>
                            </div>`;
                        }).join('')}</div>
                    </div>
                    ${namesDetail.length > 0 ? `
                    <div>
                        <div class="text-xs text-warm-400 mb-2">名字详情</div>
                        <div class="space-y-2">${namesHtml}</div>
                    </div>` : ''}
                </div>
            `;

            showModal('起名记录详情 #'+id, body, closeModal, { small: false });
        }

        async function loadArticles() {
            const params = new URLSearchParams({ page: articlesPage, pageSize: articlesPageSize });
            const data = await api('/article?' + params.toString());

            document.getElementById('pageContent').innerHTML = `
                <div class="bg-white rounded-2xl card-shadow overflow-hidden">
                    <div class="p-4 lg:p-5 flex gap-3 border-b flex-wrap" style="border-color:#f0ebe5;">
                        <button class="btn-primary px-4 lg:px-5 py-2 rounded-lg text-white text-sm" onclick="showArticleModal()">
                            <i class="fas fa-plus mr-1"></i>新建文章
                        </button>
                        <select class="input-field" id="articleStatusFilter" style="width:120px;flex-shrink:0;" onchange="articlesPage=1;loadArticles()">
                            <option value="">全部状态</option>
                            <option value="1">已发布</option>
                            <option value="0">草稿</option>
                        </select>
                        <span class="ml-auto text-warm-400 text-sm self-center">共 ${data.total || 0} 篇</span>
                    </div>
                    <div class="table-wrapper">
                        <table class="table-style">
                            <thead>
                                <tr>
                                    <th>ID</th><th>标题</th><th>浏览</th><th>推荐</th><th>状态</th><th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(data.list||[]).length ? data.list.map(a => `
                                <tr>
                                    <td>${a.id}</td>
                                    <td class="font-serif-cn font-medium max-w-[120px] lg:max-w-[200px] truncate">${a.title}</td>
                                    <td>${a.views || 0}</td>
                                    <td>${a.is_featured == 1 ? '<span class="tag tag-gold">推荐</span>' : '-'}</td>
                                    <td><span class="tag ${a.status == 1 ? 'tag-green' : 'tag-red'}">${a.status == 1 ? '已发布' : '草稿'}</span></td>
                                    <td>
                                        <button class="action-btn green" onclick="showArticleModal(${a.id})">编辑</button>
                                        <button class="action-btn ${a.status==1?'red':'green'}" onclick="toggleArticle(${a.id},${a.status})">${a.status==1?'下架':'发布'}</button>
                                        <button class="action-btn red" onclick="deleteArticle(${a.id})">删除</button>
                                    </td>
                                </tr>`).join('') : '<tr><td colspan="6" class="text-center text-warm-300 py-12">暂无文章</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    ${data.totalPages > 1 ? `<div class="p-4 flex items-center justify-center gap-4 border-t flex-wrap" style="border-color:#f0ebe5;">
                        <button class="action-btn red" ${articlesPage<=1?'disabled style="opacity:0.4"':''} onclick="articlesPage--;loadArticles()">上一页</button>
                        <span class="text-warm-500 text-sm">第 ${articlesPage} / ${data.totalPages} 页</span>
                        <button class="action-btn red" ${articlesPage>=data.totalPages?'disabled style="opacity:0.4"':''} onclick="articlesPage++;loadArticles()">下一页</button>
                    </div>` : ''}
                </div>
            `;
        }

        function showModal(title, bodyHTML, onConfirm, opts = {}) {
            const modalBox = document.getElementById('modalBox');
            modalBox.className = opts.small ? 'modal-box modal-sm' : 'modal-box';
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML + `
                <div class="flex gap-3 mt-6">
                    <button class="flex-1 py-2.5 rounded-xl border border-warm-200 text-warm-600 text-sm" onclick="closeModal()">取消</button>
                    <button class="btn-primary flex-1 py-2.5 rounded-xl text-white text-sm font-semibold" id="modalConfirmBtn">确定</button>
                </div>`;
            document.getElementById('modalConfirmBtn').onclick = onConfirm;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function showArticleModal(id) {
            articleEditId = id || null;
            const isEdit = !!id;
            if (isEdit) { loadArticleForEdit(id); return; }
            renderArticleForm({});
        }

        async function loadArticleForEdit(id) {
            const res = await fetch(API_BASE + '/article/' + id);
            const data = await res.json();
            if (data.id) { renderArticleForm(data); }
            else { showToast('文章不存在', true); }
        }

        function renderArticleForm(article) {
            const isEdit = !!articleEditId;
            document.getElementById('modalBox').className = 'modal-box';
            document.getElementById('modalTitle').textContent = isEdit ? '编辑文章' : '新建文章';
            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-warm-600 mb-2">标题 *</label>
                        <input type="text" class="input-field" id="artTitle" value="${escHtml(article.title||'')}" placeholder="请输入文章标题">
                    </div>
                    <div>
                        <label class="block text-sm text-warm-600 mb-2">摘要</label>
                        <textarea class="input-field" id="artSummary" rows="2" placeholder="请输入文章摘要">${escHtml(article.summary||'')}</textarea>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">状态</label>
                            <select class="input-field" id="artStatus">
                                <option value="1" ${(article.status||1)==1?'selected':''}>已发布</option>
                                <option value="0" ${(article.status||0)==0?'selected':''}>草稿</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">推荐</label>
                            <select class="input-field" id="artFeatured">
                                <option value="1" ${(article.is_featured||0)==1?'selected':''}>是</option>
                                <option value="0" ${(article.is_featured||0)==0?'selected':''}>否</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-warm-600 mb-2">浏览量</label>
                            <input type="number" class="input-field" id="artViews" value="${article.views||0}">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-warm-600 mb-2">封面图片URL</label>
                        <input type="text" class="input-field" id="artCover" value="${escHtml(article.cover_image||'')}" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block text-sm text-warm-600 mb-2">正文内容 *（HTML格式）</label>
                        <div class="text-xs text-warm-300 mb-1">可直接粘贴富文本内容，或使用简单HTML标签</div>
                        <textarea class="input-field" id="artContent" rows="8" placeholder="<p>文章内容...</p>">${escHtml(article.content||'')}</textarea>
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button class="flex-1 py-2.5 rounded-xl border border-warm-200 text-warm-600 text-sm" onclick="closeModal()">取消</button>
                    <button class="btn-primary flex-1 py-2.5 rounded-xl text-white text-sm font-semibold" onclick="saveArticle()">${isEdit?'保存修改':'创建文章'}</button>
                </div>`;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        async function saveArticle() {
            const title = document.getElementById('artTitle').value.trim();
            const summary = document.getElementById('artSummary').value.trim();
            const content = document.getElementById('artContent').value.trim();
            const cover_image = document.getElementById('artCover').value.trim();
            const status = parseInt(document.getElementById('artStatus').value);
            const is_featured = parseInt(document.getElementById('artFeatured').value);
            const views = parseInt(document.getElementById('artViews').value) || 0;
            if (!title || !content) { showToast('标题和内容不能为空', true); return; }
            const payload = { title, summary, content, cover_image, status, is_featured, views };
            let result;
            if (articleEditId) { result = await api('/article/' + articleEditId, { method:'PUT', body:JSON.stringify(payload) }); }
            else { result = await api('/article', { method:'POST', body:JSON.stringify(payload) }); }
            if (result.id || result.success) {
                closeModal();
                showToast(articleEditId ? '修改成功' : '创建成功');
                loadArticles();
            } else { showToast(result.error || '保存失败', true); }
        }

        async function toggleArticle(id, currentStatus) {
            const res = await fetch(API_BASE + '/article/' + id);
            const data = await res.json();
            if (data.id) {
                await api('/article/' + id, { method:'PUT', body:JSON.stringify({ status: currentStatus == 1 ? 0 : 1 }) });
                showToast(currentStatus == 1 ? '已下架' : '已发布');
                loadArticles();
            }
        }

        async function deleteArticle(id) {
            if (!confirm('确定删除这篇文章？删除后无法恢复。')) return;
            const result = await api('/article/' + id, { method:'DELETE' });
            if (!result.error) { showToast('删除成功'); loadArticles(); }
            else { showToast(result.error || '删除失败', true); }
        }

        // ========== 系统配置 ==========
        async function loadConfigs() {
            const data = await api('/admin/configs');
            document.getElementById('pageContent').innerHTML = `
                <div class="space-y-5 max-w-2xl">
                    <div class="bg-white rounded-2xl card-shadow p-4 sm:p-6">
                        <h3 class="font-serif-cn font-bold text-warm-900 mb-4">🤖 AI 配置</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm text-warm-600 mb-2">AI API 地址</label>
                                <input type="text" class="input-field" id="configApiUrl" value="${escAttr(data.ai_api_url||'')}" placeholder="https://api.deepseek.com/v1/chat/completions">
                            </div>
                            <div>
                                <label class="block text-sm text-warm-600 mb-2">AI API 密钥</label>
                                <input type="password" class="input-field" id="configApiKey" value="${escAttr(data.ai_api_key||'')}" placeholder="sk-...">
                            </div>
                            <div>
                                <label class="block text-sm text-warm-600 mb-2">AI 模型</label>
                                <input type="text" class="input-field" id="configModel" value="${escAttr(data.ai_model||'deepseek-chat')}" placeholder="deepseek-chat">
                            </div>
                        </div>
                        <button class="btn-primary px-6 py-2.5 rounded-lg text-white text-sm mt-4 w-full sm:w-auto" onclick="saveConfigs()">
                            <i class="fas fa-save mr-1"></i>保存配置
                        </button>
                    </div>
                </div>
            `;
        }

        function escAttr(str) {
            if (!str) return '';
            return str.replace(/"/g, '&quot;');
        }

        async function saveConfigs() {
            const configs = {
                'ai_api_url': document.getElementById('configApiUrl').value,
                'ai_api_key': document.getElementById('configApiKey').value,
                'ai_model': document.getElementById('configModel').value
            };
            const data = await api('/admin/configs', { method: 'POST', body: JSON.stringify(configs) });
            if (data.success) showToast('配置保存成功');
            else showToast('保存失败', true);
        }

        // ========== 通用 ==========
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function showToast(msg, isError=false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (isError ? 'error' : 'success');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
