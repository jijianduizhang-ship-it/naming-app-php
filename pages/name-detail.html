<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瑞名阁 - 名字详情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#fef7ee', 100:'#fdedd3', 200:'#fad7a5', 300:'#f6ba6d', 400:'#f19333', 500:'#ee7711', 600:'#df5d07', 700:'#b94409', 800:'#93360e', 900:'#782e0e' },
                        gold: { 50:'#fffbeb', 100:'#fef3c7', 200:'#fde68a', 300:'#fcd34d', 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706', 700:'#b45309', 800:'#92400e', 900:'#78350f' },
                        dark: { 50:'#f8f6f3', 100:'#efe9e0', 200:'#ddd2c3', 300:'#c7b59e', 400:'#b09478', 500:'#a07d64', 600:'#91705a', 700:'#775c4c', 800:'#634d42', 900:'#534138' }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background: #f5f0eb; max-width: 430px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }
        .font-serif-cn { font-family: 'Noto Serif SC', serif; }
        .card-shadow { box-shadow: 0 2px 16px rgba(139,26,26,0.08); }
        .bazi-card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); position: relative; overflow: hidden; }
        .bazi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .score-circle::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px solid #efe9e0; }
        .fav-btn { transition: all 0.3s; }
        .fav-btn.active { color: #C41E3A; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(0,0,0,0.8); color: white; padding: 14px 28px; border-radius: 12px; font-size: 14px; z-index: 9999; transition: transform 0.3s; pointer-events: none; }
        .toast.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body class="pb-8">
    <!-- 导航栏 -->
    <div class="bg-white/80 backdrop-blur-lg sticky top-0 z-50 px-5 py-4 flex items-center justify-between border-b border-dark-100/50">
        <div class="w-9 h-9 rounded-full bg-dark-50 flex items-center justify-center cursor-pointer" onclick="history.back()">
            <i class="fas fa-chevron-left text-dark-600 text-sm"></i>
        </div>
        <h1 class="font-serif-cn text-dark-800 text-base font-bold">名字详情</h1>
        <div class="w-9 h-9 rounded-full bg-dark-50 flex items-center justify-center cursor-pointer" onclick="shareName()">
            <i class="fas fa-share-nodes text-dark-400 text-sm"></i>
        </div>
    </div>

    <!-- 主内容 -->
    <div id="mainContent">
        <div class="text-center py-12">
            <p class="text-dark-400">加载中...</p>
        </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-dark-100 px-5 py-4 z-50">
        <div class="flex items-center space-x-3">
            <button class="fav-btn flex-1 py-3 rounded-xl border border-dark-200 text-dark-600 text-sm flex items-center justify-center space-x-1" id="favBtn" onclick="toggleFav()">
                <i class="far fa-heart"></i>
                <span>收藏</span>
            </button>
            <button class="flex-1 py-3 rounded-xl bg-gradient-to-r from-primary-500 to-primary-400 text-white text-sm font-medium shadow-md" onclick="goPage('/pages/naming.html')">
                <i class="fas fa-rotate-left mr-1"></i>重新生成
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var API_BASE = '/api';
        function goPage(url) { window.location.href = url; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function getRecord() {
            const records = JSON.parse(localStorage.getItem('name_records') || '[]');
            return records[0] || null;
        }

        function getCurrentNameIdx() {
            return parseInt(sessionStorage.getItem('current_name_idx') || '0');
        }

        function toggleFav() {
            const records = JSON.parse(localStorage.getItem('name_records') || '[]');
            if (!records[0]) return;
            const idx = getCurrentNameIdx();
            if (!records[0].names[idx]) return;
            records[0].names[idx].fav = !records[0].names[idx].fav;
            localStorage.setItem('name_records', JSON.stringify(records));
            render(records[0], idx, null);
            showToast(records[0].names[idx].fav ? '已收藏' : '已取消收藏');
        }

        function shareName() {
            const record = getRecord();
            if (!record) return;
            const name = record.names[getCurrentNameIdx()];
            if (!name) return;
            const text = `我在瑞名阁给宝宝起了「${record.surname}${name.name}」这个名字，寓意：${name.meaning}，评分${name.score}分！`;
            if (navigator.share) {
                navigator.share({ title: '瑞名阁 - 宝宝名字', text });
            } else {
                navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
            }
        }

        // 获取汉字笔画数
        async function fetchStrokes(chars) {
            try {
                const res = await fetch(API_BASE + '/strokes.php?chars=' + encodeURIComponent(chars));
                return await res.json();
            } catch(e) {
                return {};
            }
        }

        // 计算三才五格
        function calcSancai(tianGe, renGe, diGe) {
            var dict = {
                1:'太极之数',2:'两仪之数',3:'三才之数',4:'四象之数',5:'五行之数',
                6:'六爻之数',7:'七政之数',8:'八卦之数',9:'玄灵之数',10:'完结之数',
                11:'挽回家运',12:'掘井无泉',13:'春日牡丹',14:'破缘离散',15:'福寿双全',
                16:'厚重宅势',17:'刚顽忠义',18:'铁镜重圆',19:'衣禄丰盈',20:'外围破船' ,
                21:'明月光照',22:'秋草逢霜',23:'壮丽顶端',24:'掘地得金',25:'资才满载',
                26:'浪静水动',27:'增长孤寂',28:'亡运破家',29:'智慧兼备',30:'一盛一衰',
                31:'花韵月恼',32:'宝马金鞍',33:'常胜永生',34:'破家散财',35:'温和治家',
                36:'风浪不平',37:'猛虎出林',38:'磨砖成玉',39:'盛衰递进',40:'得时望众',
                41:'德望兼备',42:'发旺进田',43:'天赋吉格',44:'烦闷消渴',45:'叶满滋生',
                46:'罗网离奇',47:'结果铁木',48:'桃花流水',49:'极饿数理',50:'盛衰递进',
                51:'雨过天晴',52:'草就春晖',53:'外祥内苦',54:'穷鬼临门',55:'善恶相交',
                56:'雨过天晴',57:'日照青松',58:'晚景发福',59:'寒蝉悲笼',60:'争权夺利',
                61:'名可跨街',62:'衰草悠悠',63:'旭日东升',64:'骨肉离散',65:'巨流归海',
                66:'岩头跑马',67:'通合乾坤',68:'一生报国',69:'乐极生悲',70:'寿守金汤',
                71:'圆缺晦暗',72:'先苦后甜',73:'大胆无谋',74:'高峰立奇',75:'德望兼备',
                76:'门户不和',77:'自我自灭',78:'先吉后凶',79:'青山缭绕',80:'凶化贵人',
                81:'万物终了'
            };
            function desc(n, key) {
                if (n < 1 || n > 81) return '数理异常';
                var d = dict[n] || '吉凶未定';
                if (n >= 1 && n <= 81) {
                    var luck = (key === '天格' || key === '地格' || n === 1 || n === 3 || n === 5 || n === 6 || n === 7 || n === 8 || n === 11 || n === 13 || n === 15 || n === 16 || n === 18 || n === 21 || n === 23 || n === 24 || n === 25 || n === 28 || n === 29 || n === 31 || n === 32 || n === 33 || n === 35 || n === 37 || n === 39 || n === 41 || n === 45 || n === 47 || n === 48 || n === 52 || n === 57 || n === 58 || n === 61 || n === 63 || n === 65 || n === 67 || n === 68 || n === 72);
                    return { text: d, luck: luck };
                }
                return { text: d, luck: false };
            }
            return {
                tian: desc(tianGe, '天格'),
                ren: desc(renGe, '人格'),
                di: desc(diGe, '地格')
            };
        }

        // 渲染页面（strokesData: {字:笔画数})
        function render(record, idx, strokesData) {
            var main = document.getElementById('mainContent');

            if (!record || !record.names || !record.names[idx]) {
                main.innerHTML = '<div class="text-center py-16"><div class="text-5xl mb-4">🔍</div><p class="text-dark-400 text-sm mb-4">未找到名字详情</p><button class="text-primary-500 text-sm" onclick="goPage(\'/pages/naming.html\')">去起名 →</button></div>';
                return;
            }

            var surname = record.surname;
            var genderText = record.gender === 'boy' ? '男宝宝' : '女宝宝';
            var n = record.names[idx];

            var surnameStrokes = 0, nameStrokesList = [], totalStrokes = 0;
            var hasStrokes = strokesData && Object.keys(strokesData).length > 0;

            if (hasStrokes) {
                // 姓氏笔画
                var s1 = strokesData[surname[0]] || 0;
                if (surname.length === 2) {
                    var s2 = strokesData[surname[1]] || 0;
                    surnameStrokes = s1 + s2;
                } else {
                    surnameStrokes = s1;
                }
                // 名字各字笔画
                for (var ci = 0; ci < n.name.length; ci++) {
                    var cs = strokesData[n.name[ci]] || 0;
                    nameStrokesList.push(cs);
                }
                // 总笔画
                totalStrokes = surnameStrokes + nameStrokesList.reduce(function(a,b){return a+b;}, 0);
            }

            // 三才计算
            var sancai = null;
            if (hasStrokes) {
                var tianGe, renGe, diGe;
                if (surname.length === 1) {
                    // 单姓：天格=姓笔画，人格=姓+名第一字，地格=名笔画
                    tianGe = strokesData[surname[0]] || 0;
                    renGe = tianGe + (nameStrokesList[0] || 0);
                    diGe = nameStrokesList.reduce(function(a,b){return a+b;}, 0);
                } else {
                    // 复姓：天格=姓两字笔画和，人格=姓第二字+名第一字，地格=名笔画
                    tianGe = (strokesData[surname[0]] || 0) + (strokesData[surname[1]] || 0);
                    renGe = (strokesData[surname[1]] || 0) + (nameStrokesList[0] || 0);
                    diGe = nameStrokesList.reduce(function(a,b){return a+b;}, 0);
                }
                sancai = calcSancai(tianGe, renGe, diGe);
            }

            var scoreColor = n.score >= 95 ? 'text-primary-500' : n.score >= 90 ? 'text-gold-500' : 'text-dark-400';
            var wuxingBg = {金:'bg-yellow-50 text-yellow-600',木:'bg-green-50 text-green-600',水:'bg-blue-50 text-blue-600',火:'bg-red-50 text-red-600',土:'bg-amber-50 text-amber-600'};

            // 三才解读
            var sancaiResult = '';
            if (sancai) {
                var luck = sancai.tian.luck && sancai.ren.luck && sancai.di.luck;
                var tianIcon = sancai.tian.luck ? 'fa-circle-check text-green-400' : 'fa-circle-xmark text-red-400';
                var renIcon = sancai.ren.luck ? 'fa-circle-check text-green-400' : 'fa-circle-xmark text-red-400';
                var diIcon = sancai.di.luck ? 'fa-circle-check text-green-400' : 'fa-circle-xmark text-red-400';
                sancaiResult = '<div class="mt-4 bg-dark-50 rounded-xl p-3">' +
                    '<p class="text-dark-500 text-xs leading-relaxed mb-2">' +
                    '<i class="fas '+tianIcon+' mr-1"></i>天格<b>'+sancai.tian.text+'</b>（'+sancai.tian.luck+'）' +
                    ' &nbsp;<i class="fas '+renIcon+' mr-1"></i>人格<b>'+sancai.ren.text+'</b>（'+sancai.ren.luck+'）' +
                    ' &nbsp;<i class="fas '+diIcon+' mr-1"></i>地格<b>'+sancai.di.text+'</b>（'+sancai.di.luck+'）' +
                    '</p>' +
                    '<p class="text-dark-500 text-xs">' +
                    (luck ? '<i class="fas fa-circle-check text-green-400 mr-1"></i>三才配置大吉，天时地利人和，事业发展顺利。' : '<i class="fas fa-circle-exclamation text-amber-400 mr-1"></i>三才配置有凶数，需结合八字五行综合判断。') +
                    '</p></div>';
            }

            // 收藏按钮状态
            var favActive = n.fav ? 'active' : '';
            var favIcon = n.fav ? 'fas' : 'far';
            var favText = n.fav ? '已收藏' : '收藏';

            main.innerHTML = '\
                <div class="px-5 pt-6 text-center">\
                    <p class="text-dark-300 text-xs mb-2">'+surname+'姓 '+genderText+' · '+record.birthday+'</p>\
                    <h2 class="font-serif-cn text-5xl font-black text-dark-800 tracking-widest mb-2">'+surname+n.name+'</h2>\
                    <p class="text-dark-400 text-sm tracking-widest">'+surname+' · '+n.name.split('').join(' · ')+'</p>\
                    <button class="fav-btn inline-flex items-center space-x-1 mt-3 text-sm '+favActive+'" onclick="toggleFav()">\
                        <i class="'+favIcon+' fa-heart text-lg"></i>\
                        <span class="text-dark-400">'+favText+'这个名字</span>\
                    </button>\
                </div>\
                \
                <div class="px-5 mt-6">\
                    <div class="bg-white rounded-2xl p-5 card-shadow">\
                        <div class="flex items-center justify-between">\
                            <div>\
                                <p class="text-dark-400 text-xs mb-1">综合评分</p>\
                                <div class="flex items-baseline space-x-1">\
                                    <span class="font-serif-cn '+scoreColor+' text-4xl font-black">'+n.score+'</span>\
                                    <span class="text-dark-300 text-sm">/ 100</span>\
                                </div>\
                            </div>\
                            <div class="text-right">\
                                <p class="text-xs '+scoreColor+' font-medium">'+(n.score>=95?'极佳':n.score>=90?'优秀':'良好')+'</p>\
                                <p class="text-dark-300 text-xs mt-0.5">基于八字五行分析</p>\
                            </div>\
                        </div>\
                        <div class="mt-4 space-y-2">\
                            <div class="flex items-center space-x-3">\
                                <span class="text-dark-400 text-xs w-16">八字评分</span>\
                                <div class="flex-1 bg-dark-100 rounded-full h-2">\
                                    <div class="bg-gradient-to-r from-primary-500 to-primary-400 h-2 rounded-full" style="width:'+Math.min(100,n.score)+'%"></div>\
                                </div>\
                                <span class="text-dark-600 text-xs w-10 text-right">'+n.score+'</span>\
                            </div>\
                            <div class="flex items-center space-x-3">\
                                <span class="text-dark-400 text-xs w-16">五行评分</span>\
                                <div class="flex-1 bg-dark-100 rounded-full h-2">\
                                    <div class="bg-gradient-to-r from-blue-400 to-blue-500 h-2 rounded-full" style="width:'+Math.round(n.score*0.95)+'%"></div>\
                                </div>\
                                <span class="text-dark-600 text-xs w-10 text-right">'+Math.round(n.score*0.95)+'</span>\
                            </div>\
                            <div class="flex items-center space-x-3">\
                                <span class="text-dark-400 text-xs w-16">音律评分</span>\
                                <div class="flex-1 bg-dark-100 rounded-full h-2">\
                                    <div class="bg-gradient-to-r from-gold-400 to-gold-500 h-2 rounded-full" style="width:'+Math.round(n.score*0.92)+'%"></div>\
                                </div>\
                                <span class="text-dark-600 text-xs w-10 text-right">'+Math.round(n.score*0.92)+'</span>\
                            </div>\
                        </div>\
                    </div>\
                </div>\
                \
                <div class="px-5 mt-4">\
                    <div class="bg-white rounded-2xl p-5 card-shadow">\
                        <h3 class="font-serif-cn text-dark-800 font-bold mb-4">五行分析</h3>\
                        <div class="grid grid-cols-2 gap-3">\
                            <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-4 text-center">\
                                <i class="fas fa-yin-yang text-blue-400 text-lg mb-2"></i>\
                                <p class="text-dark-400 text-xs">喜用神</p>\
                                <p class="font-serif-cn text-blue-600 text-xl font-bold mt-1">'+(record.bazi && record.bazi.xiyongshen ? record.bazi.xiyongshen.join(',') : (n.wuxing || '水'))+'</p>\
                            </div>\
                            <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-4 text-center">\
                                <i class="fas fa-scale-balanced text-purple-400 text-lg mb-2"></i>\
                                <p class="text-dark-400 text-xs">名字五行</p>\
                                <p class="font-serif-cn text-purple-600 text-xl font-bold mt-1">'+(n.wuxing || '水')+'系</p>\
                            </div>\
                        </div>\
                        <div class="mt-4 bg-dark-50 rounded-xl p-3">\
                            <p class="text-dark-500 text-xs leading-relaxed">\
                                <i class="fas fa-lightbulb text-gold-400 mr-1"></i>\
                                此名五行属'+(n.wuxing || '水')+'，与宝宝八字'+(record.bazi && record.bazi.xiyongshen ? '喜用神'+record.bazi.xiyongshen.join(',')+'相符' : '相补')+'，寓意吉祥，有助运势。\
                            </p>\
                        </div>\
                    </div>\
                </div>\
                \
                <div class="px-5 mt-4">\
                    <div class="bg-white rounded-2xl p-5 card-shadow">\
                        <h3 class="font-serif-cn text-dark-800 font-bold mb-4">名字寓意</h3>\
                        <div class="bg-gradient-to-r from-primary-50 to-pink-50 rounded-xl p-4 mb-4">\
                            <p class="font-serif-cn text-dark-800 text-lg leading-relaxed">"'+n.meaning+'"</p>\
                        </div>\
                        <div class="space-y-3">\
                            <div class="flex items-start space-x-3">\
                                <div class="w-6 h-6 bg-primary-50 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">\
                                    <i class="fas fa-book text-primary-400 text-xs"></i>\
                                </div>\
                                <div>\
                                    <p class="text-dark-700 text-xs font-medium">出处典故</p>\
                                    <p class="text-dark-400 text-xs mt-0.5">'+(n.source || '诗词典籍')+'</p>\
                                </div>\
                            </div>\
                            <div class="flex items-start space-x-3">\
                                <div class="w-6 h-6 bg-gold-50 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">\
                                    <i class="fas fa-scroll text-gold-400 text-xs"></i>\
                                </div>\
                                <div>\
                                    <p class="text-dark-700 text-xs font-medium">寓意内涵</p>\
                                    <p class="text-dark-400 text-xs mt-0.5">'+(n.meaning || '名字寓意美好')+'</p>\
                                </div>\
                            </div>\
                            <div class="flex items-start space-x-3">\
                                <div class="w-6 h-6 bg-green-50 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">\
                                    <i class="fas fa-hand-holding-heart text-green-400 text-xs"></i>\
                                </div>\
                                <div>\
                                    <p class="text-dark-700 text-xs font-medium">期望祝福</p>\
                                    <p class="text-dark-400 text-xs mt-0.5">愿宝宝前程似锦，健康成长</p>\
                                </div>\
                            </div>\
                        </div>\
                    </div>\
                </div>\
                \
                <div class="px-5 mt-4 mb-24">\
                    <div class="bg-white rounded-2xl p-5 card-shadow">\
                        <h3 class="font-serif-cn text-dark-800 font-bold mb-4">笔画信息</h3>\
                        <div class="flex items-center justify-around">\
                            <div class="text-center">\
                                <p class="font-serif-cn text-dark-800 text-2xl font-bold">'+(hasStrokes ? surnameStrokes : '—')+'</p>\
                                <p class="text-dark-300 text-xs mt-1">姓氏笔画</p>\
                            </div>\
                            <div class="text-center">\
                                <p class="font-serif-cn text-dark-800 text-2xl font-bold">'+(hasStrokes ? nameStrokesList.join('+') : '—')+'</p>\
                                <p class="text-dark-300 text-xs mt-1">名字笔画</p>\
                            </div>\
                            <div class="text-center">\
                                <p class="font-serif-cn text-primary-500 text-2xl font-bold">'+(hasStrokes ? totalStrokes : '—')+'</p>\
                                <p class="text-dark-300 text-xs mt-1">总笔画</p>\
                            </div>\
                        </div>'+sancaiResult+'\
                    </div>\
                </div>\
            ';
        }

        // 初始化：加载数据+笔画，然后渲染
        (async function() {
            var record = getRecord();
            var idx = getCurrentNameIdx();
            if (!record) {
                render(null, idx, null);
                return;
            }
            // 构造所有需要查询笔画的字符
            var chars = record.surname.split('');
            var nameChars = (record.names[idx] && record.names[idx].name) ? record.names[idx].name.split('') : [];
            var allChars = chars.concat(nameChars);
            var strokesData = {};
            if (allChars.length > 0) {
                strokesData = await fetchStrokes(allChars.join(','));
            }
            render(record, idx, strokesData);
        })();
    </script>
</body>
</html>
