<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瑞名阁 - 兑换码</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#fef7ee', 100:'#fdedd3', 200:'#fad7a5', 300:'#f6ba6d', 400:'#f19333', 500:'#ee7711', 600:'#df5d07', 700:'#b94409', 800:'#93360e', 900:'#782e0e' },
                        gold: { 50:'#fffbeb', 100:'#fef3c7', 200:'#fde68a', 300:'#fcd34d', 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706', 700:'#b45309', 800:'#92400e', 900:'#78350f' },
                        dark: { 50:'#f8f6f3', 100:'#efe9e0', 200:'#ddd2c3', 300:'#c7b59e', 400:'#b09478', 500:'#a07d64', 600:'#91705a', 700:'#775c4c', 800:'#634d42', 900:'#534138' }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background: #f5f0eb; max-width: 430px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }
        .font-serif-cn { font-family: 'Noto Serif SC', serif; }
        .card-shadow { box-shadow: 0 2px 16px rgba(139,26,26,0.08); }
        .input-code { width: 100%; height: 56px; border-radius: 16px; border: 2px dashed #ddd2c3; background: #faf8f5; text-align: center; font-size: 20px; letter-spacing: 8px; color: #534138; font-weight: 600; outline: none; transition: all 0.3s; text-transform: uppercase; }
        .input-code:focus { border-color: #C41E3A; background: #fff; box-shadow: 0 0 0 4px rgba(196,30,58,0.08); }
        .input-code::placeholder { color: #c7b59e; font-weight: 400; letter-spacing: 4px; }
        .btn-primary { background: linear-gradient(135deg, #C41E3A, #E8837C); transition: all 0.3s; box-shadow: 0 4px 20px rgba(196,30,58,0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); z-index: 100; }
        .tab-item { transition: all 0.2s; cursor: pointer; }
        .tab-item.active { color: #C41E3A; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(0,0,0,0.8); color: white; padding: 16px 32px; border-radius: 12px; font-size: 14px; z-index: 9999; transition: transform 0.3s; pointer-events: none; white-space: nowrap; }
        .toast.show { transform: translate(-50%, -50%) scale(1); }
        .success-modal { animation: modalIn 0.4s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: confetti-fall 3s ease-out forwards; }
        @keyframes confetti-fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9998; padding: 20px; }
        .modal-overlay.show { display: flex; }
    </style>
</head>
<body class="pb-20">
    <!-- 导航栏 -->
    <div class="bg-white/80 backdrop-blur-lg sticky top-0 z-50 px-5 py-4 flex items-center justify-between border-b border-dark-100/50">
        <div class="w-9 h-9 rounded-full bg-dark-50 flex items-center justify-center cursor-pointer" onclick="goPage('/index.html')">
            <i class="fas fa-chevron-left text-dark-600 text-sm"></i>
        </div>
        <h1 class="font-serif-cn text-dark-800 text-base font-bold">兑换码</h1>
        <div class="w-9 h-9"></div>
    </div>

    <!-- 内容 -->
    <div class="px-5 pt-6 space-y-5">
        <!-- 说明卡片 -->
        <div class="bg-white rounded-2xl p-5 card-shadow">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 bg-primary-50 rounded-xl flex items-center justify-center">
                    <i class="fas fa-ticket-simple text-primary-500 text-lg"></i>
                </div>
                <div>
                    <h2 class="text-dark-800 font-medium text-sm">兑换码说明</h2>
                    <p class="text-dark-400 text-xs mt-0.5">输入您购买获得的兑换码</p>
                </div>
            </div>
            <div class="space-y-2">
                <div class="flex items-center space-x-2 text-dark-400 text-xs">
                    <i class="fas fa-check text-primary-400"></i>
                    <span>每个兑换码可兑换 <strong class="text-dark-700">对应次数</strong> 起名服务</span>
                </div>
                <div class="flex items-center space-x-2 text-dark-400 text-xs">
                    <i class="fas fa-check text-primary-400"></i>
                    <span>兑换码有效期为 <strong class="text-dark-700">一年</strong></span>
                </div>
                <div class="flex items-center space-x-2 text-dark-400 text-xs">
                    <i class="fas fa-check text-primary-400"></i>
                    <span>支持多次兑换，次数叠加</span>
                </div>
            </div>
        </div>

        <!-- 余额展示 -->
        <div class="bg-gradient-to-r from-primary-50 to-pink-50 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-coins text-gold-500 text-lg"></i>
                </div>
                <div>
                    <p class="text-dark-400 text-xs">当前余额</p>
                    <p class="font-serif-cn text-primary-600 text-2xl font-bold" id="creditsDisplay">0 <span class="text-sm font-sans">次</span></p>
                </div>
            </div>
            <button class="text-primary-500 text-xs font-medium cursor-pointer" onclick="goPage('/pages/naming.html')">
                立即使用 <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </div>

        <!-- 输入框 -->
        <div class="bg-white rounded-2xl p-5 card-shadow">
            <p class="text-dark-600 text-sm font-medium mb-4">输入兑换码</p>
            <input type="text" id="codeInput" class="input-code" placeholder="请输入兑换码" maxlength="20" autocomplete="off" spellcheck="false">
            <button class="btn-primary w-full py-4 rounded-2xl text-white font-medium text-base mt-4 flex items-center justify-center space-x-2" id="redeemBtn" onclick="redeemCode()">
                <i class="fas fa-gift"></i>
                <span>立即兑换</span>
            </button>
        </div>

        <!-- 提示 -->
        <div class="text-center">
            <p class="text-dark-300 text-xs">兑换码格式示例：TESTVIP、FREE666</p>
            <p class="text-dark-300 text-xs mt-1">大小写不敏感</p>
        </div>

        <!-- 历史记录 -->
        <div class="bg-white rounded-2xl p-5 card-shadow">
            <h3 class="text-dark-800 font-medium text-sm mb-3">最近兑换</h3>
            <div id="redeemHistory" class="space-y-2">
                <p class="text-dark-300 text-xs text-center py-3">暂无兑换记录</p>
            </div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar">
        <div class="flex items-center justify-around py-2 pb-5">
            <div class="tab-item flex flex-col items-center space-y-0.5 cursor-pointer" onclick="goPage('/index.html')">
                <i class="fas fa-home text-lg"></i><span class="text-xs">首页</span>
                <div class="tab-dot w-1 h-1 bg-primary-500 rounded-full"></div>
            </div>
            <div class="tab-item flex flex-col items-center space-y-0.5 cursor-pointer" onclick="goPage('/pages/naming.html')">
                <i class="fas fa-scroll text-lg"></i><span class="text-xs">起名</span>
                <div class="tab-dot w-1 h-1 bg-primary-500 rounded-full"></div>
            </div>
            <div class="tab-item flex flex-col items-center space-y-0.5 relative cursor-pointer" onclick="goPage('/pages/naming.html')">
                <div class="w-12 h-12 bg-gradient-to-br from-primary-500 to-primary-400 rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-primary-500/30">
                    <i class="fas fa-plus text-white text-lg"></i>
                </div>
                <span class="text-xs -mt-0.5">快速起名</span>
            </div>
            <div class="tab-item flex flex-col items-center space-y-0.5 cursor-pointer" onclick="goPage('/pages/history.html')">
                <i class="fas fa-clock-rotate-left text-lg"></i><span class="text-xs">记录</span>
                <div class="tab-dot w-1 h-1 bg-primary-500 rounded-full"></div>
            </div>
            <div class="tab-item flex flex-col items-center space-y-0.5 cursor-pointer" onclick="goPage('/pages/profile.html')">
                <i class="fas fa-user text-lg"></i><span class="text-xs">我的</span>
                <div class="tab-dot w-1 h-1 bg-primary-500 rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- 成功弹窗 -->
    <div class="modal-overlay" id="successModal">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm success-modal relative overflow-hidden">
            <div id="confettiContainer" class="absolute inset-0 pointer-events-none"></div>
            <div class="text-center relative z-10">
                <div class="w-16 h-16 bg-primary-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-primary-500 text-2xl"></i>
                </div>
                <h3 class="font-serif-cn text-dark-800 text-lg font-bold mb-1">兑换成功！</h3>
                <p class="text-dark-400 text-sm mb-1" id="modalMsg">获得 <strong class="text-primary-500">6</strong> 次起名服务</p>
                <p class="text-dark-300 text-xs">感谢您的支持</p>
                <button class="btn-primary w-full py-3 rounded-xl text-white font-medium mt-5" onclick="closeModal()">
                    开始起名
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '/api';

        function goPage(url) { window.location.href = url; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function updateCreditsDisplay() {
            const credits = parseInt(localStorage.getItem('naming_credits') || '0');
            document.getElementById('creditsDisplay').innerHTML = credits + ' <span class="text-sm font-sans">次</span>';
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('redeem_history') || '[]');
            const el = document.getElementById('redeemHistory');
            if (history.length === 0) {
                el.innerHTML = '<p class="text-dark-300 text-xs text-center py-3">暂无兑换记录</p>';
                return;
            }
            el.innerHTML = history.slice(0, 5).map(h => `
                <div class="flex items-center justify-between py-2 border-b border-dark-50 last:border-0">
                    <div>
                        <p class="text-dark-700 text-xs font-medium">${h.code}</p>
                        <p class="text-dark-300 text-xs">${h.time}</p>
                    </div>
                    <span class="text-primary-500 text-xs">+${h.credits}次</span>
                </div>
            `).join('');
        }

        function showSuccessModal(credits) {
            document.getElementById('modalMsg').innerHTML = '获得 <strong class="text-primary-500">' + credits + '</strong> 次起名服务';
            document.getElementById('successModal').classList.add('show');
            // 撒花效果
            const container = document.getElementById('confettiContainer');
            const colors = ['#C41E3A','#f59e0b','#10b981','#3b82f6','#8b5cf6'];
            for (let i = 0; i < 30; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDelay = Math.random() * 2 + 's';
                c.style.width = (Math.random() * 8 + 4) + 'px';
                c.style.height = c.style.width;
                container.appendChild(c);
            }
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
            document.getElementById('confettiContainer').innerHTML = '';
            goPage('/pages/naming.html');
        }

        async function redeemCode() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            if (!code) { showToast('请输入兑换码'); return; }

            const btn = document.getElementById('redeemBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 兑换中...';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                const response = await fetch(API_BASE + '/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await response.json();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-gift"></i> 立即兑换';

                if (response.ok && data.success) {
                    // 增加到本地余额
                    const credits = parseInt(localStorage.getItem('naming_credits') || '0');
                    const add = data.amount || 6;
                    localStorage.setItem('naming_credits', credits + add);

                    // 记录历史
                    const history = JSON.parse(localStorage.getItem('redeem_history') || '[]');
                    history.unshift({ code, credits: add, time: new Date().toLocaleString('zh-CN') });
                    localStorage.setItem('redeem_history', JSON.stringify(history.slice(0, 20)));

                    updateCreditsDisplay();
                    renderHistory();
                    showSuccessModal(add);
                } else {
                    showToast(data.message || '兑换码无效');
                }
            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-gift"></i> 立即兑换';
                // 网络失败，使用演示码
                if (['TESTVIP','FREE666','VIP888'].includes(code)) {
                    const credits = parseInt(localStorage.getItem('naming_credits') || '0');
                    const add = 6;
                    localStorage.setItem('naming_credits', credits + add);
                    const history = JSON.parse(localStorage.getItem('redeem_history') || '[]');
                    history.unshift({ code, credits: add, time: new Date().toLocaleString('zh-CN') });
                    localStorage.setItem('redeem_history', JSON.stringify(history.slice(0, 20)));
                    updateCreditsDisplay();
                    renderHistory();
                    showSuccessModal(add);
                } else {
                    showToast('网络错误，请重试');
                }
            }
        }

        // 回车提交
        document.getElementById('codeInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') redeemCode();
        });

        updateCreditsDisplay();
        renderHistory();
    </script>
</body>
</html>
